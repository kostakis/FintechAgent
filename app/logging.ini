[loggers]
keys=root,botocore,boto3,agent,rag

[handlers]
keys=console,file

[formatters]
keys=std

[logger_root]
level=DEBUG
handlers=console,file

[logger_botocore]
level=WARNING
handlers=
qualname=botocore
propagate=1

[logger_boto3]
level=WARNING
handlers=
qualname=boto3
propagate=1

[logger_agent]
level=DEBUG
handlers=console,file
qualname=agent
propagate=0

[logger_rag]
level=DEBUG
handlers=console,file
qualname=rag
propagate=0

[handler_console]
class=StreamHandler
level=INFO
formatter=std
args=(sys.stdout,)

[handler_file]
class=handlers.RotatingFileHandler
level=DEBUG
formatter=std
args=('logs/app.log', 'a', 5000000, 5)

[formatter_std]
format=%(asctime)s [%(levelname)s] %(name)s - %(message)s
datefmt=%Y-%m-%d %H:%M:%S
